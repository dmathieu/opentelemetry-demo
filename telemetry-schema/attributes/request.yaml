file_format: definition/2
attributes:
  - key: demo.synthetic_request
    type: string
    brief: Whether the request is synthetic/test traffic
    stability: stable
    note: >
      Indicates whether the request is synthetic traffic generated for testing or monitoring purposes ("true") or real user traffic.
      This helps distinguish production traffic from test traffic in observability systems.
      Also propagated as synthetic_request baggage.
    examples: ["true", "false"]
  - key: demo.request.flood.count
    type: int
    brief: Number of repeated requests sent in a flood
    stability: stable
    note: The number of times a single synthetic request scenario repeats a request against the same endpoint
    examples: [10, 50, 100]
  - key: demo.http.response.status_class
    type: string
    brief: HTTP response status code range
    stability: stable
    note: The range of the HTTP response status code, such as 2xx or 5xx. Derived by the collector from http.response.status_code.
    examples: ["2xx", "4xx", "5xx"]
